name: CI

on:
  push:
    branches: [master]
  # Deliberately NOT filtered by base branch, so a PR stacked on another feature
  # branch still gets CI rather than silently getting none.
  pull_request:

jobs:
  public-safe:
    # Runs regardless of what any local hook did. A pre-commit hook is advice --
    # git commit --no-verify skips it -- so for a public repository the real
    # gate has to be here.
    name: Public-safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Scan every tracked file
        run: ruby bin/check-public-safe --all
      - name: Scan the whole history
        # History is published too, so a secret removed in a later commit is
        # still readable. Cheap while the history is short; revisit if it grows.
        run: ruby bin/check-public-safe --history

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - run: bundle exec rspec

# workflow_dispatch only, and dispatched by the fleet's deploy tooling rather
# than run by hand. Shares the concurrency group every other application uses,
# which is what serialises deploys across the fleet -- concurrent image pulls
# otherwise race the host's containerd content store.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-byscott-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Read from secrets, not written here: this repository is public, so the
      # host, the deploy user, the SSH key filename and the registry account
      # are all configuration rather than content.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      IDENTITY_HOST: ${{ secrets.IDENTITY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_REGISTRY_ACCOUNT: ${{ secrets.DEPLOY_REGISTRY_ACCOUNT }}
      # A repo-level classic token with write:packages ONLY -- deliberately not
      # the org GH_TOKEN, which also carries repo, workflow and
      # delete:packages across every repository.
      #
      # It needs WRITE, not read: builder has no remote:, so kamal builds the
      # image on the runner and pushes it. An earlier version of this asked for
      # read:packages and would have failed at the push.
      #
      # Fine-grained tokens cannot be used here at all -- they expose no
      # container-registry permission -- so this is as narrow as ghcr.io allows.
      GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Write the deploy key
        # Via env:, not interpolated. This is a multi-line PEM, which is the
        # shape most likely to defeat log masking -- GitHub masks on exact
        # matches, and this repository's run logs are world-readable. printf
        # '%s' keeps the value out of the command line entirely.
        #
        # The filename reveals nothing: the usual one elsewhere names a private
        # repository, which bin/check-public-safe refuses.
        env:
          DEPLOY_KEY: ${{ secrets.IDENTITY_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "DEPLOY_SSH_KEY=$HOME/.ssh/id_deploy" >> "$GITHUB_ENV"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write .kamal/secrets
        # Every value is referenced as $NAME and resolved from the process
        # environment, never interpolated into a command. This repository is
        # public, so its run logs are world-readable: GitHub masks secrets, but
        # only on exact matches, so the safest thing is for no value to reach a
        # command line at all. Only variable NAMES appear in the log.
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IDENTITY_SIGNING_KEY: ${{ secrets.IDENTITY_SIGNING_KEY }}
          MAILER_SENDER: ${{ secrets.MAILER_SENDER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p .kamal
          {
            printf 'RAILS_MASTER_KEY=%s\n' "$RAILS_MASTER_KEY"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'GITHUB_TOKEN=%s\n' "$REGISTRY_TOKEN"
            printf 'IDENTITY_SIGNING_KEY=%s\n' "$IDENTITY_SIGNING_KEY"
            printf 'IDENTITY_ISSUER=%s\n' "$IDENTITY_ISSUER"
            printf 'MAILER_SENDER=%s\n' "$MAILER_SENDER"
            printf 'DEPLOY_REGISTRY_ACCOUNT=%s\n' "$DEPLOY_REGISTRY_ACCOUNT"
          } > .kamal/secrets
          chmod 600 .kamal/secrets

      - name: Install kamal
        # Not a bundle dependency: this application does not use kamal at
        # runtime, and adding it would pull a deploy tool into the production
        # image. An earlier version of this workflow ran `bundle exec kamal`
        # with kamal absent from the bundle, and would have failed on its first
        # step.
        run: |
          if ! bundle exec kamal version >/dev/null 2>&1; then
            gem install kamal --no-document
            echo "KAMAL=kamal" >> "$GITHUB_ENV"
          else
            echo "KAMAL=bundle exec kamal" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: $KAMAL deploy

# workflow_dispatch only, and dispatched by the fleet's deploy tooling rather
# than run by hand. Shares the concurrency group every other application uses,
# which is what serialises deploys across the fleet -- concurrent image pulls
# otherwise race the host's containerd content store.
name: Deploy

on:
  workflow_dispatch:
    # Required, not optional: the fleet's DeployService always sends a no_cache
    # input, so a workflow that declares none is rejected outright with
    # HTTP 422 "Unexpected inputs provided". That is how this was found.
    inputs:
      no_cache:
        description: "Force full rebuild without Docker cache"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-byscott-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Read from secrets, not written here: this repository is public, so the
      # host, the deploy user, the SSH key filename and the registry account
      # are all configuration rather than content.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      IDENTITY_HOST: ${{ secrets.IDENTITY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_REGISTRY_ACCOUNT: ${{ secrets.DEPLOY_REGISTRY_ACCOUNT }}
      # A repo-level classic token with write:packages ONLY -- deliberately not
      # the org GH_TOKEN, which also carries repo, workflow and
      # delete:packages across every repository.
      #
      # It needs WRITE, not read: builder has no remote:, so kamal builds the
      # image on the runner and pushes it. An earlier version of this asked for
      # read:packages and would have failed at the push.
      #
      # Fine-grained tokens cannot be used here at all -- they expose no
      # container-registry permission -- so this is as narrow as ghcr.io allows.
      GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Write the deploy key
        # Via env:, not interpolated. This is a multi-line PEM, which is the
        # shape most likely to defeat log masking -- GitHub masks on exact
        # matches, and this repository's run logs are world-readable. printf
        # '%s' keeps the value out of the command line entirely.
        #
        # The filename reveals nothing: the usual one elsewhere names a private
        # repository, which bin/check-public-safe refuses.
        env:
          DEPLOY_KEY: ${{ secrets.IDENTITY_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "DEPLOY_SSH_KEY=$HOME/.ssh/id_deploy" >> "$GITHUB_ENV"

          # An ssh CONFIG, not just a key file. Writing the key alone is not
          # enough: ssh only offers it if the filename is one it tries by
          # default, or if -i names it. The deploy's own `ssh` call for the host
          # lock passes no -i, so it failed with "Permission denied
          # (publickey)" while the key sat unused beside it.
          #
          # accept-new rather than a keyscan: it trusts the host on first
          # contact and still refuses a CHANGED key, which is the property that
          # matters, and it removes a step that can fail silently.
          cat > ~/.ssh/config <<SSH
          Host $DEPLOY_HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            IdentityFile ~/.ssh/id_deploy
          SSH
          chmod 600 ~/.ssh/config

      - name: Write .kamal/secrets
        # Every value is referenced as $NAME and resolved from the process
        # environment, never interpolated into a command. This repository is
        # public, so its run logs are world-readable: GitHub masks secrets, but
        # only on exact matches, so the safest thing is for no value to reach a
        # command line at all. Only variable NAMES appear in the log.
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IDENTITY_SIGNING_KEY: ${{ secrets.IDENTITY_SIGNING_KEY }}
          IDENTITY_ISSUER: ${{ secrets.IDENTITY_ISSUER }}
          MAILER_SENDER: ${{ secrets.MAILER_SENDER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p .kamal
          {
            printf 'RAILS_MASTER_KEY=%s\n' "$RAILS_MASTER_KEY"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'GITHUB_TOKEN=%s\n' "$REGISTRY_TOKEN"
            printf 'IDENTITY_SIGNING_KEY=%s\n' "$IDENTITY_SIGNING_KEY"
            printf 'IDENTITY_ISSUER=%s\n' "$IDENTITY_ISSUER"
            printf 'MAILER_SENDER=%s\n' "$MAILER_SENDER"
            printf 'DEPLOY_REGISTRY_ACCOUNT=%s\n' "$DEPLOY_REGISTRY_ACCOUNT"
          } > .kamal/secrets
          chmod 600 .kamal/secrets

          # Fail here rather than shipping a container that boots without them.
          #
          # Deploy 1572 reported SUCCESS with IDENTITY_ISSUER empty and
          # IDENTITY_SIGNING_KEY holding 31 bytes -- the PEM's first line and
          # nothing else, because a multi-line value cannot survive a KEY=VALUE
          # file. The healthcheck passed, then the container entered a restart
          # loop and the discovery document served an empty issuer.
          #
          # Lengths and line counts only. No value is printed: this repository
          # is public and its run logs are world-readable.
          missing=""
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            if [ -z "$value" ]; then
              missing="$missing $name"
              echo "::error::$name is empty in .kamal/secrets"
            fi
          done < .kamal/secrets

          if [ -n "$missing" ]; then
            echo "Missing deploy secrets:$missing"
            exit 1
          fi

          # A PEM is 27 lines and ~1700 bytes; base64 of it is one line. Either
          # the stored value decodes to a key or the deploy stops here.
          key_lines=$(grep -c '^IDENTITY_SIGNING_KEY=' .kamal/secrets)
          key_bytes=$(awk -F= '/^IDENTITY_SIGNING_KEY=/ { print length($0) - length($1) - 1 }' .kamal/secrets)
          echo "IDENTITY_SIGNING_KEY: $key_bytes bytes on $key_lines line(s)"

          if [ "$key_bytes" -lt 1000 ]; then
            echo "::error::IDENTITY_SIGNING_KEY is $key_bytes bytes -- too short to be a 2048-bit key."
            echo "Store it base64-encoded; a raw multi-line PEM arrives as its first line only."
            exit 1
          fi

          echo "All deploy secrets present."

      - name: Install kamal
        # Not a bundle dependency: this application does not use kamal at
        # runtime, and adding it would pull a deploy tool into the production
        # image. An earlier version of this workflow ran `bundle exec kamal`
        # with kamal absent from the bundle, and would have failed on its first
        # step.
        run: |
          if ! bundle exec kamal version >/dev/null 2>&1; then
            gem install kamal --no-document
            echo "KAMAL=kamal" >> "$GITHUB_ENV"
          else
            echo "KAMAL=bundle exec kamal" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        shell: bash
        run: |
          # Serialise across the WHOLE fleet with a host-side flock.
          #
          # The shared concurrency group above is not sufficient on its own:
          # GitHub concurrency groups are scoped per repository, so a group of
          # the same name in another repository does not queue behind this one.
          # Parallel deploys then race containerd's content store and fail with
          # "ingest commit failed: rename ... no such file or directory".
          #
          # The background SSH holds the lock for the duration of the deploy and
          # is killed afterwards to release it. 30 minute wait.
          coproc LOCKER {
            ssh -o ServerAliveInterval=30 "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
              "flock -w 1800 /var/lock/byscott-deploy bash -c 'echo LOCKED; exec 1>&-; read _'"
          }
          read -r line <&"${LOCKER[0]}"
          if [ "$line" != "LOCKED" ]; then
            echo "Could not acquire /var/lock/byscott-deploy within 30 min"
            exit 1
          fi
          echo "Acquired /var/lock/byscott-deploy; proceeding"

          if [ "${{ inputs.no_cache }}" = "true" ]; then
            $KAMAL deploy -c .kamal/deploy.yml --no-cache
          else
            $KAMAL deploy -c .kamal/deploy.yml
          fi
          KAMAL_RC=$?

          kill "$COPROC_PID" 2>/dev/null || true
          wait "$COPROC_PID" 2>/dev/null || true
          exit $KAMAL_RC

pre-commit:
  parallel: false
  commands:
    public-safe:
      # FIRST, and on its own: this repository is public, so a secret or a piece
      # of fleet detail must be refused before anything else is even considered.
      run: bin/with-ruby ruby bin/check-public-safe --staged
    rubocop:
      glob: "*.rb"
      run: bin/with-ruby bundle exec rubocop --force-exclusion {staged_files}

commit-msg:
  commands:
    public-safe:
      # Commit messages are published as surely as the code is. A message may
      # discuss these patterns by name, but must not contain an actual address,
      # key or token.
      run: bin/with-ruby ruby bin/check-public-safe --message {1}

pre-push:
  commands:
    public-safe:
      run: bin/with-ruby ruby bin/check-public-safe --all
    rspec:
      run: bin/with-ruby bundle exec rspec
